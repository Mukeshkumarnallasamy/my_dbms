{% extends 'base.html' %}

{% block title %}Add Member - Gym Management System{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Add New Member</h1>
    
    <form method="POST" class="form">
        <div class="form-row">
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="dob">Date of Birth *</label>
                <input type="date" id="dob" name="dob" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="gender">Gender *</label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="contact_no">Contact Number *</label>
                <input type="tel" id="contact_no" name="contact_no" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="weight">Weight (kg) *</label>
                <input type="number" id="weight" name="weight" step="0.1" required>
            </div>
            
            <div class="form-group">
                <label for="height">Height (cm) *</label>
                <input type="number" id="height" name="height" step="0.1" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="goal">Fitness Goal *</label>
                <select id="goal" name="goal" required>
                    <option value="">Select Goal</option>
                    <option value="Weight Loss">Weight Loss</option>
                    <option value="Muscle Gain">Muscle Gain</option>
                    <option value="Endurance">Endurance</option>
                    <option value="Flexibility">Flexibility</option>
                    <option value="General Fitness">General Fitness</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="health_issue">Health Issues</label>
                <input type="text" id="health_issue" name="health_issue" placeholder="e.g., Back pain, None">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="join_date">Join Date *</label>
                <input type="date" id="join_date" name="join_date" required>
            </div>
            
            <div class="form-group">
                <label for="trainer_id">Assign Trainer</label>
                <select id="trainer_id" name="trainer_id">
                    <option value="">Not Assigned</option>
                    {% for trainer in trainers %}
                    <option value="{{ trainer.trainer_id }}">{{ trainer.name }} ({{ trainer.specialization }})</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add Member</button>
            <a href="{{ url_for('members_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
