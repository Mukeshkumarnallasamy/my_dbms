{% extends 'base.html' %}

{% block title %}Edit Member - Gym Management System{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Edit Member: {{ member.name }}</h1>
    
    <form method="POST" class="form">
        <div class="form-row">
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" value="{{ member.name }}" required>
            </div>
            
            <div class="form-group">
                <label for="gender">Gender *</label>
                <select id="gender" name="gender" required>
                    <option value="Male" {% if member.gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if member.gender == 'Female' %}selected{% endif %}>Female</option>
                    <option value="Other" {% if member.gender == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="contact_no">Contact Number *</label>
                <input type="tel" id="contact_no" name="contact_no" value="{{ member.contact_no }}" required>
            </div>
            
            <div class="form-group">
                <label for="weight">Weight (kg) *</label>
                <input type="number" id="weight" name="weight" step="0.1" value="{{ member.weight }}" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="height">Height (cm) *</label>
                <input type="number" id="height" name="height" step="0.1" value="{{ member.height }}" required>
            </div>
            
            <div class="form-group">
                <label for="health_issue">Health Issues</label>
                <input type="text" id="health_issue" name="health_issue" value="{{ member.health_issue }}">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="goal">Fitness Goal *</label>
                <select id="goal" name="goal" required>
                    <option value="Weight Loss" {% if member.goal == 'Weight Loss' %}selected{% endif %}>Weight Loss</option>
                    <option value="Muscle Gain" {% if member.goal == 'Muscle Gain' %}selected{% endif %}>Muscle Gain</option>
                    <option value="Endurance" {% if member.goal == 'Endurance' %}selected{% endif %}>Endurance</option>
                    <option value="Flexibility" {% if member.goal == 'Flexibility' %}selected{% endif %}>Flexibility</option>
                    <option value="General Fitness" {% if member.goal == 'General Fitness' %}selected{% endif %}>General Fitness</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="trainer_id">Assign Trainer</label>
                <select id="trainer_id" name="trainer_id">
                    <option value="">Not Assigned</option>
                    {% for trainer in trainers %}
                    <option value="{{ trainer.trainer_id }}" {% if trainer.trainer_id == member.trainer_id %}selected{% endif %}>
                        {{ trainer.name }} ({{ trainer.specialization }})
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Member</button>
            <a href="{{ url_for('view_member', member_id=member.member_id) }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
