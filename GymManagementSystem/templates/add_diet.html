{% extends 'base.html' %}

{% block title %}Add Diet Plan - Gym Management System{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Add Diet Plan for {{ member.name }}</h1>
    
    <form method="POST" class="form">
        <div class="form-row">
            <div class="form-group">
                <label for="goal">Diet Goal *</label>
                <select id="goal" name="goal" required>
                    <option value="">Select Goal</option>
                    <option value="Weight Loss">Weight Loss</option>
                    <option value="Muscle Gain">Muscle Gain</option>
                    <option value="Maintenance">Maintenance</option>
                    <option value="Endurance">Endurance</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="meal_type">Meal Type *</label>
                <select id="meal_type" name="meal_type" required>
                    <option value="">Select Meal</option>
                    <option value="Breakfast">Breakfast</option>
                    <option value="Lunch">Lunch</option>
                    <option value="Dinner">Dinner</option>
                    <option value="Snack">Snack</option>
                </select>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group full-width">
                <label for="items">Food Items *</label>
                <textarea id="items" name="items" rows="4" placeholder="e.g., Grilled chicken breast, Brown rice, Broccoli, Olive oil" required></textarea>
            </div>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add Diet Plan</button>
            <a href="{{ url_for('view_member', member_id=member.member_id) }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
