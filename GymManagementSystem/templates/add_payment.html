{% extends 'base.html' %}

{% block title %}Add Payment - Gym Management System{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Record Payment for {{ member.name }}</h1>
    
    <form method="POST" class="form">
        <div class="form-row">
            <div class="form-group">
                <label for="payment_date">Payment Date *</label>
                <input type="date" id="payment_date" name="payment_date" required>
            </div>
            
            <div class="form-group">
                <label for="amount">Amount ($) *</label>
                <input type="number" id="amount" name="amount" step="0.01" placeholder="e.g., 99.99" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="status">Payment Status *</label>
                <select id="status" name="status" required>
                    <option value="">Select Status</option>
                    <option value="Paid">Paid</option>
                    <option value="Pending">Pending</option>
                    <option value="Failed">Failed</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="notes">Notes</label>
                <input type="text" id="notes" name="notes" placeholder="e.g., Monthly subscription">
            </div>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Record Payment</button>
            <a href="{{ url_for('view_member', member_id=member.member_id) }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
