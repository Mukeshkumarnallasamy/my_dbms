{% extends 'base.html' %}

{% block title %}Add Progress - Gym Management System{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Record Progress for {{ member.name }}</h1>
    
    <form method="POST" class="form">
        <div class="form-row">
            <div class="form-group">
                <label for="date">Date *</label>
                <input type="date" id="date" name="date" value="{{ now }}" required>
            </div>
            
            <div class="form-group">
                <label for="weight">Weight (kg) *</label>
                <input type="number" id="weight" name="weight" step="0.1" value="{{ member.weight }}" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea id="notes" name="notes" rows="4" placeholder="e.g., Member feeling stronger, good workout session"></textarea>
            </div>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Record Progress</button>
            <a href="{{ url_for('view_member', member_id=member.member_id) }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    window.now = new Date();
});
</script>
{% endblock %}
