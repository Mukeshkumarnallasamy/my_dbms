{% extends 'base.html' %}

{% block title %}Add Workout Plan - Gym Management System{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Create New Workout Plan</h1>
    
    <form method="POST" class="form">
        <div class="form-row">
            <div class="form-group">
                <label for="goal">Fitness Goal *</label>
                <select id="goal" name="goal" required>
                    <option value="">Select Goal</option>
                    <option value="Weight Loss">Weight Loss</option>
                    <option value="Muscle Gain">Muscle Gain</option>
                    <option value="Endurance">Endurance</option>
                    <option value="Flexibility">Flexibility</option>
                    <option value="Strength">Strength</option>
                    <option value="General Fitness">General Fitness</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="duration">Duration *</label>
                <input type="text" id="duration" name="duration" placeholder="e.g., 12 weeks, 1 month" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group full-width">
                <label for="description">Description *</label>
                <textarea id="description" name="description" rows="6" placeholder="Detailed workout plan description including exercises, sets, reps, etc." required></textarea>
            </div>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Create Plan</button>
            <a href="{{ url_for('workout_plans_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
