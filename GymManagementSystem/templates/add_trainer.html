{% extends 'base.html' %}

{% block title %}Add Trainer - Gym Management System{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Add New Trainer</h1>
    
    <form method="POST" class="form">
        <div class="form-row">
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="specialization">Specialization *</label>
                <input type="text" id="specialization" name="specialization" placeholder="e.g., Strength Training, Cardio, Yoga" required>
            </div>
            
            <div class="form-group">
                <label for="contact_no">Contact Number *</label>
                <input type="tel" id="contact_no" name="contact_no" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="shift_time">Shift Time *</label>
                <select id="shift_time" name="shift_time" required>
                    <option value="">Select Shift</option>
                    <option value="6 AM - 12 PM">6 AM - 12 PM</option>
                    <option value="12 PM - 6 PM">12 PM - 6 PM</option>
                    <option value="6 PM - 10 PM">6 PM - 10 PM</option>
                    <option value="Full Time">Full Time</option>
                </select>
            </div>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add Trainer</button>
            <a href="{{ url_for('trainers_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
